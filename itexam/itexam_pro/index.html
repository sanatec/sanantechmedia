<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Solved Questions</title>
<style>
  /* ============ design tokens ============ */
  :root{
    --bg:#0b1220;
    --ink:#f6f4fb;
    --muted:#9aa5c0;
    --mid-a:#1fb5a3;
    --mid-b:#0b6b8a;
    --sslc-a:#ff9b54;
    --sslc-b:#d6336c;
    --radius:26px;
  }

  /* ============ reset ============ */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{min-height:100%}

  /* ============ page ============ */
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",
                "Noto Sans Malayalam","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background-color:var(--bg);
    background-image:
      radial-gradient(900px 520px at 88% -10%, rgba(52,70,140,.85), transparent 62%),
      radial-gradient(700px 480px at -12% 106%, rgba(86,32,96,.70), transparent 62%),
      radial-gradient(700px 420px at 50% 118%, rgba(14,90,120,.35), transparent 66%);
    background-repeat:no-repeat;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;

    padding:24px 18px;
    padding-top:calc(env(safe-area-inset-top,0px) + 24px);
    padding-right:calc(env(safe-area-inset-right,0px) + 18px);
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
    padding-left:calc(env(safe-area-inset-left,0px) + 18px);
  }

  /* soft dot texture, fades out downwards */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:24px 24px;
    -webkit-mask-image:radial-gradient(120% 85% at 50% 0%, #000 0%, transparent 78%);
    mask-image:radial-gradient(120% 85% at 50% 0%, #000 0%, transparent 78%);
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:560px;
    margin:0 auto;
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    gap:22px;
    gap:clamp(18px,4.5vw,26px);
  }

  /* ============ hero / title box ============ */
  .hero{position:relative}

  .hero::before{
    content:"";
    position:absolute;
    top:-34px;
    left:50%;
    width:min(380px,95%);
    height:200px;
    transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(94,234,212,.16), transparent 72%);
    pointer-events:none;
    z-index:0;
  }

  .hero-box{
    position:relative;
    z-index:1;
    text-align:center;
    padding:30px 22px 28px;
    border-radius:var(--radius);
    border:1px solid rgba(255,255,255,.10);
    background-image:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.015));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.14),
      0 30px 60px -30px rgba(0,0,0,.9);
    -webkit-backdrop-filter:blur(16px);
    backdrop-filter:blur(16px);
    overflow:hidden;
    animation:rise .65s cubic-bezier(.2,.7,.3,1) both;
  }

  /* gradient hairline on top edge */
  .hero-box::before{
    content:"";
    position:absolute;
    top:0; left:14%; right:14%;
    height:2px;
    border-radius:2px;
    background:linear-gradient(90deg, transparent, #5eead4, #60a5fa, transparent);
  }

  /* subtle inner light at the bottom */
  .hero-box::after{
    content:"";
    position:absolute;
    left:-15%; right:-15%; bottom:-70%;
    height:180px;
    background:radial-gradient(closest-side, rgba(96,165,250,.22), transparent 72%);
    pointer-events:none;
  }

  .hero-badge{
    position:relative;
    z-index:1;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 13px;
    border-radius:999px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#a5f3ea;
    background:rgba(94,234,212,.10);
    border:1px solid rgba(94,234,212,.28);
  }
  .hero-badge svg{width:11px;height:11px;display:block}

  /* ---- the beautiful heading ---- */
  .hero-title{
    position:relative;
    z-index:1;
    margin-top:15px;
    font-family:"Playfair Display","Georgia","Noto Serif","Times New Roman",serif;
    font-weight:700;
    font-size:30px;
    font-size:clamp(30px,8.6vw,44px);
    line-height:1.1;
    letter-spacing:.005em;
  }
  .hero-title span{
    display:inline-block;
    color:#fff;
  }
  /* gradient lettering only where supported (safe fallback: white text) */
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .hero-title span{
      background-image:linear-gradient(100deg,#ffffff 0%,#dbeafe 28%,#a5f3ea 58%,#ffd9b8 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      -webkit-text-fill-color:transparent;
    }
  }

  .hero-rule{
    position:relative;
    z-index:1;
    display:block;
    width:66px;
    height:2px;
    margin:16px auto 0;
    border-radius:2px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
  }

  .hero-sub{
    position:relative;
    z-index:1;
    margin-top:14px;
    font-size:13.5px;
    font-size:clamp(13.5px,3.6vw,15px);
    line-height:1.5;
    color:var(--muted);
    max-width:34ch;
    margin-left:auto;
    margin-right:auto;
  }

  /* ============ cards ============ */
  .cards{
    display:flex;
    flex-direction:column;
    gap:14px;
    gap:clamp(12px,3.5vw,16px);
  }

  .card{
    --a:var(--mid-a);
    --b:var(--mid-b);

    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    gap:clamp(12px,3.6vw,18px);
    width:100%;
    min-height:100px;
    padding:18px 16px;
    padding:clamp(18px,4.6vw,24px) clamp(16px,4vw,22px);
    border:0;
    border-radius:var(--radius);
    color:#fff;
    text-align:left;
    font:inherit;
    cursor:pointer;
    overflow:hidden;
    -webkit-appearance:none;
    appearance:none;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
    background-color:var(--b);
    background-image:linear-gradient(135deg,var(--a),var(--b));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.26),
      0 18px 34px -16px rgba(0,0,0,.8);
    transition:transform .16s ease, box-shadow .16s ease;
    animation:rise .6s cubic-bezier(.2,.7,.3,1) backwards;
  }

  .card.sslc{
    --a:var(--sslc-a);
    --b:var(--sslc-b);
    animation-delay:.09s;
  }

  /* decorative soft circles */
  .card::before,
  .card::after{
    content:"";
    position:absolute;
    border-radius:50%;
    pointer-events:none;
  }
  .card::before{
    width:190px;height:190px;top:-72px;right:-62px;
    background:rgba(255,255,255,.12);
  }
  .card::after{
    width:120px;height:120px;bottom:-64px;right:36px;
    background:rgba(255,255,255,.09);
  }

  .icon{
    position:relative;
    z-index:1;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    width:52px;height:52px;
    width:clamp(48px,13vw,64px);
    height:clamp(48px,13vw,64px);
    border-radius:17px;
    border-radius:clamp(14px,4vw,18px);
    border:1px solid rgba(255,255,255,.30);
    background-image:linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,.12));
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
  }
  .icon svg{width:55%;height:55%;display:block}

  .text{
    position:relative;
    z-index:1;
    flex:1 1 auto;
    min-width:0;
  }
  .title{
    display:block;
    font-size:17px;
    font-size:clamp(17px,4.7vw,21px);
    line-height:1.25;
    font-weight:800;
    letter-spacing:-.2px;
    overflow-wrap:break-word;
  }
  .desc{
    display:block;
    margin-top:5px;
    font-size:12.5px;
    font-size:clamp(12.5px,3.4vw,14px);
    line-height:1.4;
    opacity:.9;
    overflow-wrap:break-word;
  }

  .go{
    position:relative;
    z-index:1;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px;height:34px;
    width:clamp(32px,8.6vw,42px);
    height:clamp(32px,8.6vw,42px);
    border-radius:50%;
    background:#fff;
    color:var(--b);
    box-shadow:0 6px 14px -6px rgba(0,0,0,.55);
    transition:transform .16s ease;
  }
  .go svg{width:50%;height:50%;display:block}

  /* ============ interaction states ============ */
  .card:active{
    transform:scale(.975);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.2),
      0 8px 18px -12px rgba(0,0,0,.85);
  }
  .card:active .go{transform:translateX(2px)}

  .card:focus{outline:none}
  .card:focus-visible{outline:3px solid #fff;outline-offset:3px}

  @media (hover:hover) and (pointer:fine){
    .card:hover{
      transform:translateY(-2px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.3),
        0 24px 40px -18px rgba(0,0,0,.85);
    }
    .card:hover .go{transform:translateX(2px)}
    .card:hover:active{transform:scale(.975)}
  }

  /* ============ footer ============ */
  footer{
    margin-top:auto;
    padding-top:14px;
    text-align:center;
    font-size:12.5px;
    line-height:1.4;
    color:var(--muted);
  }
  footer::before{
    content:"";
    display:block;
    height:1px;
    margin-bottom:16px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.13), transparent);
  }

  /* ============ entrance animation ============ */
  @keyframes rise{
    from{opacity:0; transform:translateY(14px)}
    to{opacity:1; transform:translateY(0)}
  }

  /* ============ small screens ============ */
  @media (max-height:520px) and (orientation:landscape){
    body{
      padding-top:calc(env(safe-area-inset-top,0px) + 14px);
      padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    }
    .hero-box{padding:20px 18px 18px}
    .hero-title{font-size:24px}
    .hero-sub{margin-top:9px;font-size:13px}
    .card{min-height:0;padding-top:14px;padding-bottom:14px}
    .icon{width:44px;height:44px;border-radius:14px}
  }

  @media (max-width:359px){
    .go{display:none}
    .icon{width:44px;height:44px}
    .hero-box{padding:24px 16px 22px}
  }

  /* ============ motion preferences ============ */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      transition:none !important;
      animation:none !important;
    }
  }
</style>
</head>
<body>

<div class="page">

  <header class="hero">
    <div class="hero-box">
      <span class="hero-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l2.2 5.1L20 10l-5.8 1.9L12 17l-2.2-5.1L4 10l5.8-1.9z"/>
        </svg>
        Exam Prep
      </span>

      <h1 class="hero-title"><span>Solved Questions</span></h1>

      <span class="hero-rule" aria-hidden="true"></span>

      <p class="hero-sub">Choose your exam and start practising.</p>
    </div>
  </header>

  <main class="cards">

    <button class="card mid" type="button" data-exam="MIDTERM"
            aria-label="Open Mid Term IT Exam 2026 — practice questions and mock test">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="3" width="14" height="18" rx="2.5"/>
          <path d="M9 8h6M9 12h6M9 16h3"/>
        </svg>
      </span>
      <span class="text">
        <span class="title">Mid Term IT Exam 2026</span>
        <span class="desc">Practice questions and mock test</span>
      </span>
      <span class="go" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5l7 7-7 7"/>
        </svg>
      </span>
    </button>

    <button class="card sslc" type="button" data-exam="SSLC"
            aria-label="Open SSLC IT Model Exam 2026 — full model paper for final practice">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 9l10-5 10 5-10 5z"/>
          <path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/>
          <path d="M22 9v6"/>
        </svg>
      </span>
      <span class="text">
        <span class="title">IT Model Exam 2026</span>
        <span class="desc">Full model paper for final practice</span>
      </span>
      <span class="go" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5l7 7-7 7"/>
        </svg>
      </span>
    </button>

  </main>

  <footer>Good luck with your exams!</footer>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     PASTE YOUR LINKS HERE (keep the quotation marks)
     ============================================================ */
  var LINKS = {
    MIDTERM: "midterm_26.html",
    SSLC:    "model_26.html"
  };

  /* Set to true to open the link in a new tab */
  var OPEN_IN_NEW_TAB = false;

  /* Prevents a double-tap from firing two navigations */
  var navigating = false;

  function openExam(name) {
    if (navigating) { return; }

    var url = LINKS[name];

    /* Use the pasted link once it has been replaced with a real one */
    if (url && url.indexOf('PASTE-') === -1) {
      navigating = true;
      if (OPEN_IN_NEW_TAB) {
        var win = window.open(url, '_blank');
        if (win) { try { win.opener = null; } catch (e) {} }
        navigating = false;
      } else {
        window.location.href = url;
      }
      return;
    }

    /* Fall back to the Android bridge (see MainActivity) */
    try {
      if (window.Android && typeof window.Android.openActivity === 'function') {
        window.Android.openActivity(name);
        return;
      }
    } catch (e) { /* ignore, try the deep link below */ }

    window.location.href = 'app://open/' + name;
  }

  /* Delegated click handling — works for any number of cards */
  var cards = document.querySelectorAll('.card[data-exam]');
  for (var i = 0; i < cards.length; i++) {
    (function (card) {
      card.addEventListener('click', function (event) {
        event.preventDefault();
        openExam(card.getAttribute('data-exam'));
      }, false);
    })(cards[i]);
  }

  /* Reset navigation lock when returning via the back button */
  window.addEventListener('pageshow', function () {
    navigating = false;
  }, false);
})();
</script>
</body>
</html>
