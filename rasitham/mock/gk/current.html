<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ആനുകാലികം ക്വിസ് 2025</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .malayalam {
            font-family: 'Manjari', sans-serif;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-option:disabled {
            opacity: 0.8;
            cursor: not-allowed;
        }
        .correct {
            animation: pulse-green 1s;
            background-color: #22c55e !important;
            color: white !important;
            border-color: #16a34a !important;
        }
        .wrong {
            animation: shake 0.5s;
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #dc2626 !important;
        }
        @keyframes pulse-green {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-cyan-400 to-teal-600 min-h-screen flex items-center justify-center p-4">

    <div id="app-container" class="w-full max-w-md mx-auto">

        <!-- Language Selection Screen -->
        <div id="language-screen" class="text-center text-white p-8 rounded-2xl shadow-2xl card">
            <h1 class="text-4xl font-bold mb-2 malayalam">ആനുകാലികം ക്വിസ് 2025</h1>
            <h2 class="text-2xl font-bold mb-8">Current Affairs Quiz 2025</h2>
            <p class="mb-4 malayalam">ഭാഷ തിരഞ്ഞെടുക്കുക:</p>
            <p class="mb-8">Select Language:</p>
            <div class="flex flex-col space-y-4">
                <button onclick="startQuiz('ml')" class="bg-white text-teal-600 font-bold py-3 px-6 rounded-lg text-xl shadow-lg hover:bg-teal-50 transition-transform transform hover:scale-105 malayalam">മലയാളം</button>
                <button onclick="startQuiz('en')" class="bg-white text-cyan-600 font-bold py-3 px-6 rounded-lg text-xl shadow-lg hover:bg-cyan-50 transition-transform transform hover:scale-105">English</button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden p-6 bg-white/90 rounded-2xl shadow-2xl card">
            <div id="header" class="flex justify-between items-center mb-4">
                <div id="question-counter" class="text-lg font-semibold text-gray-700"></div>
                <div id="score-counter" class="text-lg font-semibold text-green-600"></div>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                <div id="progress-bar" class="bg-cyan-500 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
            <div id="question-container" class="mb-6">
                <p id="question-text" class="text-2xl font-bold text-center text-gray-800" style="min-height: 100px;"></p>
            </div>
            <div id="options-container" class="grid grid-cols-1 gap-4">
                <!-- Options dynamically inserted -->
            </div>
            <div id="feedback" class="mt-4 text-center font-bold text-lg" style="min-height: 30px;"></div>
            <div class="flex justify-between mt-8">
                <button id="back-btn" onclick="prevQuestion()" class="bg-gray-300 text-gray-700 font-bold py-2 px-6 rounded-lg shadow hover:bg-gray-400 transition-transform transform hover:scale-105">&lt; Back</button>
                <button id="next-btn" onclick="nextQuestion()" class="bg-teal-500 text-white font-bold py-2 px-6 rounded-lg shadow hover:bg-teal-600 transition-transform transform hover:scale-105">Next &gt;</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center p-8 bg-white/90 rounded-2xl shadow-2xl card">
            <h2 id="result-title" class="text-4xl font-bold mb-4 text-gray-800"></h2>
            <p id="final-score" class="text-2xl mb-6 text-gray-700"></p>
            <p id="result-message" class="text-xl mb-8"></p>
            <button onclick="restartQuiz()" class="bg-cyan-600 text-white font-bold py-3 px-8 rounded-lg text-xl shadow-lg hover:bg-cyan-700 transition-transform transform hover:scale-105">
                വീണ്ടും കളിക്കാം / Play Again
            </button>
        </div>

    </div>

    <script>
        // --- Sound ---
        const correctSound = new Tone.Synth({
            oscillator: { type: 'sine' },
            envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 1 }
        }).toDestination();
        const wrongSound = new Tone.Synth({
            oscillator: { type: 'square' },
            envelope: { attack: 0.005, decay: 0.2, sustain: 0, release: 0.2 }
        }).toDestination();

        function playCorrectSound() { Tone.start();
            correctSound.triggerAttackRelease("C5", "8n"); }

        function playWrongSound() { Tone.start();
            wrongSound.triggerAttackRelease("C3", "8n"); }

        // --- 75 NEW Current Affairs Questions (2025-26) ---
        const quizData = [

        ];

        // --- App State ---
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedLang = 'ml';
        let userAnswers = new Array(quizData.length + 1).fill(null);
        let questions = [];

        // --- DOM ---
        const languageScreen = document.getElementById('language-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionCounter = document.getElementById('question-counter');
        const scoreCounter = document.getElementById('score-counter');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedback = document.getElementById('feedback');
        const backBtn = document.getElementById('back-btn');
        const nextBtn = document.getElementById('next-btn');

        // --- Functions ---
        function startQuiz(lang) {
            selectedLang = lang;
            questions = [...quizData].sort(() => Math.random() - 0.5);
            languageScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            feedback.textContent = '';
            optionsContainer.innerHTML = '';
            if (currentQuestionIndex >= questions.length) { showResults(); return; }

            const q = questions[currentQuestionIndex][selectedLang];
            const qData = questions[currentQuestionIndex];

            questionText.className = `text-2xl font-bold text-center text-gray-800 ${selectedLang === 'ml' ? 'malayalam' : ''}`;
            questionText.textContent = q.q;
            questionCounter.textContent = `Q ${currentQuestionIndex + 1}/${questions.length}`;
            scoreCounter.textContent = `Score: ${score}`;
            progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

            const shuffled = [...q.o].sort(() => Math.random() - 0.5);
            shuffled.forEach(opt => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.className = `btn-option w-full p-4 rounded-lg border-2 border-gray-300 text-lg font-semibold text-gray-700 bg-white hover:bg-cyan-100 hover:border-cyan-400 transition ${selectedLang === 'ml' ? 'malayalam' : ''}`;
                btn.onclick = () => selectAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });

            updateNavButtons();
            if (userAnswers[qData.id] !== null) showPreviousAnswer();
        }

        function selectAnswer(selected, btn) {
            const qData = questions[currentQuestionIndex];
            const q = qData[selectedLang];
            const correct = q.a;

            if (userAnswers[qData.id] !== correct && selected === correct) score++;
            else if (userAnswers[qData.id] === correct && selected !== correct) score--;

            userAnswers[qData.id] = selected;

            const btns = optionsContainer.querySelectorAll('button');
            btns.forEach(b => {
                b.disabled = true;
                if (b.textContent === correct) b.classList.add('correct');
            });

            if (selected === correct) {
                playCorrectSound();
                feedback.textContent = selectedLang === 'ml' ? 'ശരിയുത്തരം!' : 'Correct!';
                feedback.className = 'mt-4 text-center font-bold text-lg text-green-600';
            } else {
                playWrongSound();
                btn.classList.add('wrong');
                feedback.innerHTML = `${selectedLang === 'ml' ? 'തെറ്റ്! ശരിയുത്തരം' : 'Wrong! Answer:'} <span class="font-bold">${correct}</span>`;
                feedback.className = 'mt-4 text-center font-semibold text-lg text-red-600';
            }
            scoreCounter.textContent = `Score: ${score}`;
        }

        function showPreviousAnswer() {
            const qData = questions[currentQuestionIndex];
            const selected = userAnswers[qData.id];
            const q = qData[selectedLang];
            const correct = q.a;

            const btns = optionsContainer.querySelectorAll('button');
            btns.forEach(b => {
                b.disabled = true;
                if (b.textContent === correct) b.classList.add('correct');
                if (b.textContent === selected && selected !== correct) b.classList.add('wrong');
            });

            if (selected !== correct) {
                feedback.innerHTML = `${selectedLang === 'ml' ? 'തെറ്റ്! ശരിയുത്തരം' : 'Wrong! Answer:'} <span class="font-bold">${correct}</span>`;
                feedback.className = 'mt-4 text-center font-semibold text-lg text-red-600';
            } else {
                feedback.textContent = selectedLang === 'ml' ? 'ശരിയുത്തരം!' : 'Correct!';
                feedback.className = 'mt-4 text-center font-bold text-lg text-green-600';
            }
        }

        function updateNavButtons() {
            backBtn.disabled = currentQuestionIndex === 0;
            backBtn.classList.toggle('opacity-50', backBtn.disabled);
            nextBtn.textContent = currentQuestionIndex === questions.length - 1 ?
                (selectedLang === 'ml' ? 'പൂർത്തിയാക്കുക' : 'Finish') :
                (selectedLang === 'ml' ? 'അടുത്തത് >' : 'Next >');
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) { currentQuestionIndex++;
                loadQuestion(); } else showResults();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) { currentQuestionIndex--;
                loadQuestion(); }
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const pct = Math.round((score / questions.length) * 100);
            const title = document.getElementById('result-title');
            const fs = document.getElementById('final-score');
            const msg = document.getElementById('result-message');

            title.className = `text-4xl font-bold mb-4 ${selectedLang === 'ml' ? 'malayalam' : ''}`;
            fs.className = `text-2xl mb-6 text-gray-700 ${selectedLang === 'ml' ? 'malayalam' : ''}`;
            msg.className = `text-xl mb-8 ${selectedLang === 'ml' ? 'malayalam' : ''}`;

            if (selectedLang === 'ml') {
                title.textContent = 'ഫലം';
                fs.textContent = `സ്കോർ: ${score} / ${questions.length}`;
                if (pct >= 80) msg.textContent = 'അടിപൊളി! നിങ്ങൾ വളരെ മിടുക്കനാണ്.';
                else if (pct >= 50) msg.textContent = 'നന്നായി! കൂടുതൽ പഠിക്കാം.';
                else msg.textContent = 'ശ്രമിക്കൂ, വീണ്ടും പരീക്ഷിക്കൂ!';
            } else {
                title.textContent = 'Results';
                fs.textContent = `Score: ${score} / ${questions.length}`;
                if (pct >= 80) msg.textContent = 'Excellent! You\'re brilliant.';
                else if (pct >= 50) msg.textContent = 'Good! Keep learning.';
                else msg.textContent = 'Try again, you can do it!';
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers.fill(null);
            questions = [];
            resultScreen.classList.add('hidden');
            languageScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
